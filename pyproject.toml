[project]
name = "pointjournal"
version = "0.1.0"
description = "CLI learning journal: milestones, breakdowns, and journal logs in SQLite."
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
ptjournal = "pointjournal.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
